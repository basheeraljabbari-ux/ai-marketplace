name: Backend CI

on:
  push:
    paths:
      - "ai-marketplace-backend/**"
  pull_request:
    paths:
      - "ai-marketplace-backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-marketplace-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_marketplace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check app loads (import + OpenAPI schema build)
        run: python -c "from app.main import app; app.openapi()"

      - name: Run unit tests (no DB required)
        run: pytest tests/test_security.py tests/test_pagination.py tests/test_attributes_validator.py tests/test_search_filters.py -v

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_marketplace_test
        run: pytest tests/test_integration.py -v
