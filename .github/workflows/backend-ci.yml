name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "ai-marketplace-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "ai-marketplace-backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-marketplace-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_marketplace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # POST /listings enqueues an RQ job unconditionally (app/modules/ai/service.py)
      # — AI_PROVIDER=mock does not bypass it, so the integration tests need a real Redis.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check app loads (import + OpenAPI schema build)
        run: python -c "from app.main import app; app.openapi()"

      # --ignore بدل تعداد الملفات يدوياً: التعداد اليدوي يعني إن أي ملف اختبار
      # جديد ما ينشغّل بـ CI بصمت، وما ينلاحظ لأن النتيجة تبقى خضراء.
      - name: Run unit tests (no DB required)
        run: pytest --ignore=tests/test_integration.py -v

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_marketplace_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/test_integration.py -v
