name: Frontend CI

on:
  push:
    paths:
      - "ai-marketplace-web/**"
  pull_request:
    paths:
      - "ai-marketplace-web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-marketplace-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ai-marketplace-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check + build
        run: npm run build
